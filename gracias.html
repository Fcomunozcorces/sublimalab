<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gracias — Sublima Lab</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Public+Sans:wght@400;700&display=swap"><style>
/* Sublima Lab — estilos base y responsive. Los estilos de diseño van inline en index.html. */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#F3F5F2;-webkit-font-smoothing:antialiased}
a{color:#0E2433}a:hover{color:#F0782A}
input,select,textarea{width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid #7CC7D3;outline-offset:1px}
button{cursor:pointer}
button:hover{filter:brightness(0.95)}
@media (max-width:1024px){
  [style*="grid-template-columns: repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  [style*="grid-template-columns: repeat(3"]{grid-template-columns:repeat(1,minmax(0,1fr)) !important}
  [style*="grid-template-columns: minmax(0, 5fr) minmax(0, 7fr)"]{grid-template-columns:1fr !important}
  h1{font-size:48px !important}
  h2{font-size:36px !important}
}
@media (max-width:640px){
  [style*="grid-template-columns: repeat(2"]{grid-template-columns:1fr !important}
  header nav a:not(:last-child){display:none}
  h1{font-size:40px !important}
  h2{font-size:30px !important}
  section{padding-top:56px !important;padding-bottom:56px !important}
  table{display:block;overflow-x:auto;white-space:nowrap}
  form>div,form>button,form>p{grid-column:span 1 !important}
}
</style></head>
<body style="background:#0E2433;color:#F3F5F2;font-family:'Public Sans',Verdana,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
<div style="max-width:640px;display:flex;flex-direction:column;gap:20px;text-align:center;align-items:center">
<img src="logo-claro.png" alt="Sublima Lab" style="width:260px">
<h1 style="margin:0;font-family:'Oswald',Verdana,sans-serif;font-size:44px;line-height:1.1">Recibimos tu solicitud</h1>
<p style="margin:0;font-size:18px;line-height:1.5;color:#B9CBD3">Te respondemos en 24 horas hábiles con una cotización y la fecha más cercana para tu prueba de desarrollo.</p>
<a href="index.html" style="background:#F0782A;color:#0E2433;padding:14px 24px;border-radius:8px;text-decoration:none;font-weight:700">Volver al inicio</a>
</div></body></html>
